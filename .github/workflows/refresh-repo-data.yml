name: Refresh repo data

# Monthly refresh of stars/forks/licenses/health signals, plus a weekly staleness
# gate that fails loudly if the committed snapshot has gone out of date (for
# example because the refresh job was disabled or its token expired).
#
# Requires a REPO_DATA_TOKEN secret: a classic PAT with no scopes, or a
# fine-grained PAT with public-repository read access. The default GITHUB_TOKEN
# is limited to 1,000 requests/hour, which cannot cover ~3,830 repo lookups.

on:
  schedule:
    - cron: '17 5 1 * *' # monthly refresh (1st, 05:17 UTC)
    - cron: '17 5 8 * *' # weekly staleness gate (8th, 05:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-repo-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify refresh token
        env:
          TOKEN: ${{ secrets.REPO_DATA_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REPO_DATA_TOKEN is not set. Add a PAT with public-repo read access as the REPO_DATA_TOKEN secret; the built-in GITHUB_TOKEN cannot cover ~3,830 requests/hour."
            exit 1
          fi

      - name: Refresh repo data
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_DATA_TOKEN }}
        run: npm run refresh:repo-data

      - name: Fail if the refreshed snapshot is stale or incomplete
        run: npm run check:repo-data

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/data/curatedRepos.ts src/data/repoHealth.ts; then
            echo "Repo data already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/curatedRepos.ts src/data/repoHealth.ts
          git commit -m "chore: monthly repo data refresh"
          git push

  staleness:
    if: github.event_name == 'schedule' && github.event.schedule == '17 5 8 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail if the committed snapshot is stale
        run: npm run check:repo-data
